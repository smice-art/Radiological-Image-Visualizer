schema_version = "1.0.0"

id = "radiological_image_visualizer"
version = "1.0.1"
name = "Radiological Image Visualizer"
tagline = "View CT, MRI and X-ray scans from DICOM files in 3D"
maintainer = "Claudio"
website = "https://superhivemarket.com/creators/smice"
type = "add-on"

tags = ["Import-Export", "Render"]

blender_version_min = "4.2.0"
license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 Claudio"]

# Decoder wheels for compressed DICOM exist for these systems; on others the add-on
# still works with uncompressed DICOM
platforms = ["windows-x64", "windows-arm64", "macos-arm64", "macos-x64", "linux-x64"]

wheels = [
  "./wheels/pydicom-3.0.2-py3-none-any.whl",
  "./wheels/pylibjpeg-2.1.0-py3-none-any.whl",
  "./wheels/pylibjpeg_libjpeg-2.3.0-cp313-cp313-manylinux_2_17_x86_64.manylinux2014_x86_64.whl",
  "./wheels/pylibjpeg_libjpeg-2.4.0-cp311-cp311-manylinux2014_x86_64.manylinux_2_17_x86_64.whl",
  "./wheels/pylibjpeg_libjpeg-2.4.0-cp313-cp313-macosx_11_0_arm64.whl",
  "./wheels/pylibjpeg_libjpeg-2.4.0-cp313-cp313-win_amd64.whl",
  "./wheels/pylibjpeg_libjpeg-2.5.0-cp311-cp311-macosx_10_9_x86_64.whl",
  "./wheels/pylibjpeg_libjpeg-2.5.0-cp311-cp311-macosx_11_0_arm64.whl",
  "./wheels/pylibjpeg_libjpeg-2.5.0-cp311-cp311-win_amd64.whl",
  "./wheels/pylibjpeg_openjpeg-2.5.0-cp313-cp313-macosx_11_0_arm64.whl",
  "./wheels/pylibjpeg_openjpeg-2.5.0-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.whl",
  "./wheels/pylibjpeg_openjpeg-2.5.0-cp313-cp313-win_amd64.whl",
  "./wheels/pylibjpeg_openjpeg-2.6.0-cp311-cp311-macosx_10_9_x86_64.whl",
  "./wheels/pylibjpeg_openjpeg-2.6.0-cp311-cp311-macosx_11_0_arm64.whl",
  "./wheels/pylibjpeg_openjpeg-2.6.0-cp311-cp311-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl",
  "./wheels/pylibjpeg_openjpeg-2.6.0-cp311-cp311-win_amd64.whl",
]

[permissions]
files = "Read DICOM files and write volume cache files"
